# ─────────────────────────────────────────────────────────
# TEST: Escenarios de usuario
# Simula flujos completos de usuario real:
#   1. Visita la página principal
#   2. Inicia sesión
#   3. Navega el dashboard
#   4. Realiza una operación
#   5. Cierra sesión
# ─────────────────────────────────────────────────────────
config:
  target: "https://dckcloud.com"
  phases:
    - duration: 60
      arrivalRate: 3
      name: "User journey warm-up"
    - duration: 180
      arrivalRate: 10
      name: "User journey sustained"
  payload:
    path: "../data/users.csv"
    fields:
      - "username"
      - "password"
    order: "random"
    skipHeader: true
  defaults:
    headers:
      Content-Type: "application/json"
  processor: "../processors/helpers.js"

scenarios:
  # ── Flujo completo de usuario ────────────────────────
  - name: "Flujo completo — login → dashboard → acción → logout"
    weight: 5
    flow:
      # 1. Visitar home
      - get:
          url: "/"
          expect:
            - statusCode: 200
      - think: 2

      # 2. Iniciar sesión
      - post:
          url: "/api/auth/login"
          json:
            username: "{{ username }}"
            password: "{{ password }}"
          capture:
            - json: "$.token"
              as: "authToken"
          expect:
            - statusCode: 200
      - think: 1

      # 3. Navegar al dashboard
      - get:
          url: "/api/protected/dashboard"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: 200
      - think: 3

      # 4. Consultar datos
      - get:
          url: "/api/protected/records"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: 200
      - think: 2

      # 5. Cerrar sesión
      - post:
          url: "/api/auth/logout"
          headers:
            Authorization: "Bearer {{ authToken }}"

  # ── Visitante anónimo ────────────────────────────────
  - name: "Visitante anónimo — solo lectura"
    weight: 3
    flow:
      - get:
          url: "/"
      - think: 3
      - get:
          url: "/about"
      - think: 2
      - get:
          url: "/contact"
