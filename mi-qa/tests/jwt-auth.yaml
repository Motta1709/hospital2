config:
  target: "http://localhost/hospital"
  processor: "../scripts/helpers.js"
  phases:
    - name: "Prueba de Stress Auth - 5 Etapas Consecutivas"
      duration: 60
      arrivalRate: 5
      rampTo: 20
  
  payload:
    - path: "../data/usuarios.csv"
      fields: ["username", "password"]
    - path: "../data/productos.csv"
      fields: ["nombre_medicamento"]
    - path: "../data/clientes.csv"
      fields: ["cliente_id"]

  plugins:
    expect: {}

scenarios:
  - name: "Secuencia Completa (Auth Focus)"
    flow:
      - get: { url: "/?route=home", expect: [{ statusCode: 200 }] }
      - post:
          url: "/?route=auth&action=login"
          form: { username: "{{ username }}", password: "{{ password }}" }
          capture: { header: "set-cookie", as: "sessionCookie" }
      - get: { url: "/?route=api&entity=products&q={{ nombre_medicamento }}", headers: { Cookie: "{{ sessionCookie }}" } }
      - get: { url: "/?route=clients&action=profile&id={{ cliente_id }}", headers: { Cookie: "{{ sessionCookie }}" } }
      - function: "generarFechas"
      - get: { url: "/?route=reports&date_from={{ fecha_ayer }}&date_to={{ fecha_hoy }}", headers: { Cookie: "{{ sessionCookie }}" } }
      - get: { url: "/?route=inventory&action=alerts", headers: { Cookie: "{{ sessionCookie }}" } }
